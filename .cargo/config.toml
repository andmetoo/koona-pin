# TypeScript types of the IPC contract are generated by ts-rs during
# `cargo test` (NP-007). The file is at the repository root so it applies
# whether cargo runs here (`npm run check`) or in src-tauri. Ids and counts
# stay `number`: they are far below 2^53.
[env]
TS_RS_EXPORT_DIR = { value = "src/bindings", relative = true }
TS_RS_LARGE_INT = "number"
