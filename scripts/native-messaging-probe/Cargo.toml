[package]
name = "native-messaging-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Прототип NP-014: native messaging host, который передаёт захват работающему приложению через именованный канал"

# Отдельный проект, чтобы не собирать Tauri.
[dependencies]
serde_json = "1.0"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[workspace]
