name: CI

# Every pull request and every push to main, and by hand. Pull requests from forks run with a read-only
# token and no secrets (pull_request, never pull_request_target); this job needs none. The ruleset of
# main requires its result. The Linux matrix (linux.yml) stays manual: it needs the feedback secret
# for the release build and takes about an hour.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels its run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Build, unit tests, IPC types, Playwright UI
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # Bun's package cache, as linux.yml keeps it.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-windows-${{ hashFiles('bun.lock') }}
          restore-keys: bun-windows-
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      # Rust tests also regenerate the IPC types in src/bindings (ts-rs, NP-007),
      # so the TypeScript build below checks the interface against fresh types.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Generated IPC types are committed
        run: bun run check:bindings
      - name: TypeScript and Vite build
        run: bun run build
      - name: Vitest
        run: bun run test
      # Builds the Chrome, Edge and Firefox packages, then lints the Firefox one.
      - name: Extension packages, web-ext lint
        run: bun run extension:lint
      - name: Install Playwright Chromium
        run: bunx --bun playwright install chromium
      # Screenshot baselines depend on local font rendering and are checked locally only.
      - name: Playwright UI, functional
        run: bun run test:ui -- --grep-invert "@visual"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-ui-results
          path: test-results/
          if-no-files-found: ignore
