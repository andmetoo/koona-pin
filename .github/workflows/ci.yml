name: CI

# Every pull request and every push to main, and by hand. Pull requests from forks run with a read-only
# token and no secrets (pull_request, never pull_request_target): the Linux build then takes a placeholder
# feedback address and the CI images are only pulled, never pushed (linux.yml). Linux is the main
# platform: its pipeline (linux.yml) runs the unit tests, the IPC types, Vitest, the extension lint and
# Playwright UI, and checks the packages on every distribution. Windows and macOS check only what is
# their own: the Rust tests on that system and the packaging.
#
# A pull request runs what its files can break («changes»): only docs and the changelog, nothing; scripts,
# tests and the Linux pipeline, Linux; the app, its dependencies and toolchains, or this file, everything.
# Pushes to main and runs by hand run everything. «CI» sums the jobs up: it is the one check main
# requires (with CLA), green when no job that ran failed. The package and distribution jobs of linux.yml
# do not count outside a release (continue-on-error there).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels its run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.paths.outputs.linux }}
      native: ${{ steps.paths.outputs.native }}
    steps:
      # The pull request's merge commit with main as its first parent: two commits are enough.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "$EVENT: everything runs"
            printf 'linux=true\nnative=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          linux=false native=false
          while IFS= read -r file; do
            echo "$file"
            case "$file" in
              docs/* | changelog/* | design/* | *.md | LICENSE* | .github/workflows/cla.yml | .github/workflows/release.yml) ;;
              # src-tauri/* includes the Safari extension's Xcode project (src-tauri/macos/safari).
              src/* | src-tauri/* | scripts/build-macos.mjs | scripts/build-extension.mjs | scripts/build-android.mjs | scripts/build-ios-sim.mjs | \
                scripts/lib/paths.mjs | package.json | bun.lock | .bun-version | rust-toolchain.toml | .cargo/* | \
                vite.config.ts | tsconfig*.json | index.html | .github/workflows/ci.yml)
                linux=true native=true ;;
              *) linux=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "Linux: $linux, Windows and macOS: $native"
          printf 'linux=%s\nnative=%s\n' "$linux" "$native" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    uses: ./.github/workflows/linux.yml
    secrets: inherit
    # The images job builds a missing CI image and pushes it to GHCR (ghcr.io/andmetoo/koona-ci-*).
    permissions:
      contents: read
      packages: write

  windows:
    name: Windows / Rust tests
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # Bun's package cache.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-windows-${{ hashFiles('bun.lock') }}
          restore-keys: bun-windows-
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      # What differs on Windows: paths, the registry of the native host (NP-016), the single-instance pipe.
      # The IPC types they regenerate are checked on Linux (linux.yml, check:bindings).
      # No installer here: a second, release build of every crate doubled the job, and the one that ships
      # is built and signed on the owner's computer (bun run release:windows), where a packaging problem
      # shows. The native Playwright tests of WebView2 do not run here either: on a hosted runner WebView2
      # does not open its CDP port (docs/testing.md), they run on the owner's computer.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked --workspace

  # macOS checks for #56: what only macOS compiles — the Rust tests and the app bundle. No artifacts, no
  # Apple credentials (release.yml builds the macOS release).
  macos:
    # A plain name: GitHub adds the matrix in brackets, «macOS 15 (arm64)», when the job runs; an
    # expression of the matrix would show unexpanded when the job is skipped (a pull request of scripts).
    name: macOS 15
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Intel is temporarily disabled; add x64 (runner macos-15-intel) when requested.
        arch: [arm64]
    runs-on: ${{ matrix.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-macos-${{ matrix.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-macos-${{ matrix.arch }}-
      - name: Rust from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-test-${{ matrix.arch }}
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      # Network tests use 127.0.0.2..11 to represent different hosts. Unlike Linux/Windows,
      # macOS only binds configured loopback addresses; keep the tests themselves unchanged.
      - name: Loopback aliases for local HTTP tests
        run: |
          for suffix in {2..11}; do
            sudo ifconfig lo0 alias "127.0.0.$suffix" up
          done
      - name: Rust tests
        run: cargo test --locked --workspace --manifest-path src-tauri/Cargo.toml
      # The app bundle alone, so a packaging problem shows here; Tauri's beforeBuildCommand runs the
      # TypeScript and Vite build first. Nothing is zipped or uploaded.
      - name: TypeScript, Vite and the app bundle
        run: bun run tauri build --config src-tauri/tauri.macos-test.conf.json --bundles app
      # The Safari app extension (NP-119), so a broken handler or Xcode project shows in the pull request:
      # its relay check, then the target as build:macos:safari builds it, signed to run locally (no team,
      # no profile). Its web part is release/dev/safari. Not embedded, nothing uploaded.
      - name: Safari extension
        run: |
          bun run extension:build
          xcrun swiftc -swift-version 5 -parse-as-library -o "$RUNNER_TEMP/relay-check" \
            src-tauri/macos/safari/Extension/Relay.swift src-tauri/macos/safari/Tests/RelayCheck.swift
          "$RUNNER_TEMP/relay-check"
          xcodebuild -quiet -project src-tauri/macos/safari/KoonaPinSafari.xcodeproj -target KoonaPinSafari \
            -configuration Release SYMROOT="$RUNNER_TEMP/safari/Products" OBJROOT="$RUNNER_TEMP/safari/Intermediates" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build
          codesign --verify --strict "$RUNNER_TEMP/safari/Products/Release/Koona Pin Safari.appex"

  # The phone builds (NP-151): that main still builds for Android and the iOS Simulator, debug, one
  # architecture each. Nothing is signed for a store, run or uploaded; the checks on emulators and phones
  # are made by hand (docs/testing.md).
  android:
    name: Android / build
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The NDK the Mac builds with; the SDK platform of compileSdk (src-tauri/gen/android/app/build.gradle.kts).
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-android-${{ hashFiles('bun.lock') }}
          restore-keys: bun-android-
      - name: Rust from rust-toolchain.toml, with the Android target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
          cache-on-failure: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: NDK and SDK platform from the SDK manager
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-37"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Android debug build (arm64)
        run: bun run tauri android build --debug --target aarch64
      # Android's 16 KB pages: zipalign and the ELF LOAD alignment, as build:android checks its release APK.
      - name: 16 KB alignment of the APK
        run: bun scripts/build-android.mjs --check src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk

  ios:
    name: iOS Simulator / build
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-ios-${{ hashFiles('bun.lock') }}
          restore-keys: bun-ios-
      - name: Rust from rust-toolchain.toml, with the Simulator target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios-sim
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      # Signed to run in the Simulator only: no team, no profile.
      - name: iOS Simulator debug build (arm64)
        run: bun run tauri ios build --debug --target aarch64-sim

  # The one check main requires besides CLA: green when every job above either passed or was not needed
  # (skipped), red when one failed or was cancelled. It always runs, so a pull request of docs only has
  # it too, in seconds.
  ci:
    name: CI
    if: ${{ always() }}
    needs: [changes, linux, windows, macos, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "::error::A job of this run failed or was cancelled"
            exit 1
          fi
