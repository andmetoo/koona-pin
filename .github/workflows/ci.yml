name: CI

# Every pull request and every push to main, and by hand. Pull requests from forks run with a read-only
# token and no secrets (pull_request, never pull_request_target): the Linux build then takes a placeholder
# feedback address and the CI images are only pulled, never pushed (linux.yml). Linux is the main
# platform: its pipeline (linux.yml) runs the unit tests, the IPC types, Vitest, the extension lint and
# Playwright UI, and checks the packages on every distribution. Windows and macOS check only what is
# their own: the Rust tests on that system and the packaging.
#
# A pull request runs only what its files can break («changes»): docs/changelog, nothing; docs/kpin, Linux
# tests and .kpin copy; tests/ui and tests/phone, Playwright UI; src/*, Linux tests and Playwright UI;
# platform-specific paths, their own platform job; shared Rust/app configs and toolchains, all required jobs.
# Advisory Linux packaging, distribution and WebKitGTK checks run inside «linux-packages» (outside «CI»'s
# needs) on PRs touching Linux packaging/desktop paths so they never delay the required check, and inside
# «linux» in one pass on pushes to main and workflow_dispatch. «CI» sums the required jobs up: it is
# the one check main requires (with CLA), green when no job that ran failed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels its run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux_test: ${{ steps.paths.outputs.linux_test }}
      linux_ui: ${{ steps.paths.outputs.linux_ui }}
      linux_pkg: ${{ steps.paths.outputs.linux_pkg }}
      windows: ${{ steps.paths.outputs.windows }}
      macos: ${{ steps.paths.outputs.macos }}
      android: ${{ steps.paths.outputs.android }}
      ios: ${{ steps.paths.outputs.ios }}
      kpin: ${{ steps.paths.outputs.kpin }}
    steps:
      # The pull request's merge commit with main as its first parent: two commits are enough.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "$EVENT: everything runs"
            printf 'linux_test=true\nlinux_ui=true\nlinux_pkg=true\nwindows=true\nmacos=true\nandroid=true\nios=true\nkpin=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          linux_test=false linux_ui=false linux_pkg=false windows=false macos=false android=false ios=false kpin=false
          while IFS= read -r file; do
            echo "$file"
            # The .kpin copy can only drift through these: its check clones koona-project/kpin, so it
            # runs for them alone, not for every change.
            case "$file" in
              docs/kpin/* | docs/kpin.tag | scripts/check-kpin-copy.mjs | .github/workflows/ci.yml) kpin=true ;;
            esac
            case "$file" in
              # The .kpin spec, schema and conformance suite: Rust reader tests and Vitest read them on Linux.
              docs/kpin/* | docs/kpin.tag) linux_test=true ;;
              # Vitest extension/src/feedback.test.js reads the flat brand SVGs under design/.
              design/brand/pin-spirit-flat/*) linux_test=true ;;
              docs/* | changelog/* | design/* | *.md | LICENSE* | .github/workflows/cla.yml | .github/workflows/release.yml | .github/workflows/extension.yml) ;;
              # Shared test fixtures: Rust embeds bookmarks/url-keys; Playwright uses app/article fixtures.
              tests/fixtures/*) linux_test=true linux_ui=true windows=true macos=true ;;
              # Playwright UI tests only.
              tests/ui/* | tests/phone/* | playwright.config.ts) linux_ui=true ;;
              # Linux workflow or CI image definitions check every Linux job (tests, UI, packaging/distro).
              .github/workflows/linux.yml | scripts/linux/images/* | scripts/linux/images.mjs)
                linux_test=true linux_ui=true linux_pkg=true ;;
              # Linux packaging, distribution and WebKitGTK scripts.
              scripts/linux/* | scripts/build-linux-packages.mjs | scripts/build-aur.mjs | scripts/smoke-host.mjs | \
                scripts/smoke-registration.mjs | scripts/smoke-extension.mjs | scripts/webkitgtk-check.mjs)
                linux_pkg=true ;;
              # src-tauri/linux/* includes aur/PKGBUILD (embedded by channel.rs) and Linux package assets.
              src-tauri/linux/*) linux_test=true linux_pkg=true windows=true macos=true ;;
              # Browser extension: Linux lint/tests and macOS Safari appex build.
              extension/* | scripts/build-extension.mjs) linux_test=true macos=true ;;
              # Supabase SQL tests and Vitest config.
              supabase/* | vitest.config.ts) linux_test=true ;;
              # capture.ts is embedded by src-tauri/src/desktop/native_host.rs tests (include_str!).
              src/services/capture.ts) linux_test=true linux_ui=true windows=true macos=true ;;
              # Frontend sources: checked by Linux tsc/Vite/Vitest + Playwright UI.
              src/* | vite.config.ts | tsconfig*.json | index.html) linux_test=true linux_ui=true ;;
              # Platform-specific native paths (gen/ and koona-share strings are also checked by Vitest nativeStrings.test.ts).
              src-tauri/gen/android/* | src-tauri/plugins/koona-share/android/*) linux_test=true android=true ;;
              src-tauri/tauri.android.conf.json | src-tauri/commercial/koona-play/android/* | \
                src-tauri/plugins/koona-mobile/android/* | scripts/build-android.mjs | scripts/check-apk-billing.mjs)
                android=true ;;
              src-tauri/gen/apple/* | src-tauri/plugins/koona-share/ios-extension/*) linux_test=true ios=true ;;
              src-tauri/tauri.ios.conf.json | src-tauri/commercial/koona-appstore/ios/* | \
                src-tauri/plugins/koona-mobile/ios/* | src-tauri/plugins/koona-share/ios/* | \
                scripts/build-ios-sim.mjs | scripts/lib/ios.mjs)
                ios=true ;;
              src-tauri/macos/* | src-tauri/tauri.macos*.conf.json | scripts/build-macos.mjs) macos=true ;;
              # native_host.rs embeds src-tauri/nsis/hooks.nsh across desktop tests.
              src-tauri/nsis/*) linux_test=true windows=true macos=true ;;
              src-tauri/windows/* | src-tauri/tauri.windows.conf.json) windows=true ;;
              src-tauri/src/desktop/*) linux_test=true linux_pkg=true windows=true macos=true ;;
              src-tauri/src/mobile/*) android=true ios=true ;;
              # App metadata/icons drive Linux packaging as well as every platform build.
              src-tauri/tauri.conf.json | src-tauri/icons/*)
                linux_test=true linux_pkg=true windows=true macos=true android=true ios=true ;;
              # Shared dependencies, toolchains, and workflow definitions run everything.
              src-tauri/Cargo.toml | src-tauri/Cargo.lock | package.json | bun.lock | .bun-version | \
                rust-toolchain.toml | .cargo/* | scripts/lib/paths.mjs | scripts/lib/env.mjs | .github/workflows/ci.yml)
                linux_test=true linux_ui=true linux_pkg=true windows=true macos=true android=true ios=true ;;
              # Remaining Rust / Tauri core changes run all required platform builds and tests.
              src-tauri/*) linux_test=true windows=true macos=true android=true ios=true ;;
              *) linux_test=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "linux_test=$linux_test linux_ui=$linux_ui linux_pkg=$linux_pkg windows=$windows macos=$macos android=$android ios=$ios kpin=$kpin"
          printf 'linux_test=%s\nlinux_ui=%s\nlinux_pkg=%s\nwindows=%s\nmacos=%s\nandroid=%s\nios=%s\nkpin=%s\n' \
            "$linux_test" "$linux_ui" "$linux_pkg" "$windows" "$macos" "$android" "$ios" "$kpin" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.linux_test == 'true' || needs.changes.outputs.linux_ui == 'true'
    uses: ./.github/workflows/linux.yml
    with:
      run_tests: ${{ needs.changes.outputs.linux_test == 'true' }}
      run_ui: ${{ needs.changes.outputs.linux_ui == 'true' }}
      run_packages: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
    # The images job builds a missing CI image and pushes it to GHCR (ghcr.io/andmetoo/koona-ci-*).
    permissions:
      contents: read
      packages: write

  # Advisory Linux packaging, distribution and WebKitGTK checks on PRs only (pushes to main and
  # workflow_dispatch run them inside «linux» in one pass): kept outside «ci»'s needs so mirror
  # hiccups or slow WebKitGTK runs never block the required CI check on pull requests.
  linux-packages:
    name: Linux packaging
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.linux_pkg == 'true'
    uses: ./.github/workflows/linux.yml
    with:
      run_tests: false
      run_ui: false
      run_packages: true
    secrets: inherit
    permissions:
      contents: read
      packages: write

  windows:
    name: Windows / Rust tests
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      # Saved from main only, as on Linux: every pull request saved 3 GB of Rust caches and pushed main's out
      # of the repository's 10 GB.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # What differs on Windows: paths, the registry of the native host (NP-016), the single-instance pipe.
      # The IPC types they regenerate are checked on Linux (linux.yml, check:bindings).
      # No installer here: a second, release build of every crate doubled the job, and the one that ships
      # is built and signed on the owner's computer (bun run release:windows), where a packaging problem
      # shows. The native Playwright tests of WebView2 do not run here either: on a hosted runner WebView2
      # does not open its CDP port (docs/testing.md), they run on the owner's computer.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked --workspace

  # macOS checks for #56: what only macOS compiles — the Rust tests and the app bundle. No artifacts, no
  # Apple credentials (release.yml builds the macOS release).
  macos:
    # A plain name: GitHub adds the matrix in brackets, «macOS 15 (arm64)», when the job runs; an
    # expression of the matrix would show unexpanded when the job is skipped (a pull request of scripts).
    name: macOS 15
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Intel is temporarily disabled; add x64 (runner macos-15-intel) when requested.
        arch: [arm64]
    runs-on: ${{ matrix.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Rust from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-test-${{ matrix.arch }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
      # Network tests use 127.0.0.2..11 to represent different hosts. Unlike Linux/Windows,
      # macOS only binds configured loopback addresses; keep the tests themselves unchanged.
      - name: Loopback aliases for local HTTP tests
        run: |
          for suffix in {2..11}; do
            sudo ifconfig lo0 alias "127.0.0.$suffix" up
          done
      - name: Rust tests
        run: cargo test --locked --workspace --manifest-path src-tauri/Cargo.toml
      # The app bundle alone, so a packaging problem shows here; Tauri's beforeBuildCommand runs the
      # TypeScript and Vite build first. On PRs, build --debug to reuse target/debug from Rust tests;
      # on main/workflow_dispatch, build release so main also warms the release dependency cache for release.yml.
      - name: TypeScript, Vite and the app bundle
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            bun run tauri build --debug --config src-tauri/tauri.macos-test.conf.json --bundles app
          else
            bun run tauri build --config src-tauri/tauri.macos-test.conf.json --bundles app
          fi
      # The Safari app extension (NP-119), so a broken handler or Xcode project shows in the pull request:
      # its relay check, then the target as build:macos:safari builds it, signed to run locally (no team,
      # no profile). Its web part is release/dev/safari. Not embedded, nothing uploaded.
      - name: Safari extension
        run: |
          bun run extension:build
          xcrun swiftc -swift-version 5 -parse-as-library -o "$RUNNER_TEMP/relay-check" \
            src-tauri/macos/safari/Extension/Relay.swift src-tauri/macos/safari/Tests/RelayCheck.swift
          "$RUNNER_TEMP/relay-check"
          xcodebuild -quiet -project src-tauri/macos/safari/KoonaPinSafari.xcodeproj -target KoonaPinSafari \
            -configuration Release SYMROOT="$RUNNER_TEMP/safari/Products" OBJROOT="$RUNNER_TEMP/safari/Intermediates" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build
          codesign --verify --strict "$RUNNER_TEMP/safari/Products/Release/Koona Pin Safari.appex"
      # The Quick Look thumbnail extension of `.kpin` lists (2.18.1), compiled as embedThumbnail in
      # scripts/build-macos.mjs compiles it, so a broken provider shows here. Not embedded, nothing uploaded.
      - name: Thumbnail extension
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library -O -target "$(uname -m)-apple-macos15.0" \
            -module-name KoonaPinThumbnail -framework QuickLookThumbnailing -Xlinker -e -Xlinker _NSExtensionMain \
            -o "$RUNNER_TEMP/KoonaPinThumbnail" src-tauri/macos/thumbnail/ThumbnailProvider.swift

  # The phone builds (NP-151): that main still builds for Android and the iOS Simulator, debug, one
  # architecture each. Nothing is signed for a store, run or uploaded; the checks on emulators and phones
  # are made by hand (docs/testing.md).
  android:
    name: Android / build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The NDK the Mac builds with; the SDK platform of compileSdk (src-tauri/gen/android/app/build.gradle.kts).
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Rust from rust-toolchain.toml, with the Android target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
          # Remove preinstalled runner toolchains so rust-cache hashes only rust-toolchain.toml's active toolchain.
          active=$(rustup show active-toolchain | awk '{print $1}')
          while read -r tc _; do
            if [ -n "$tc" ] && [ "$tc" != "$active" ]; then
              rustup toolchain uninstall "$tc"
            fi
          done < <(rustup toolchain list)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Gradle's distribution and dependencies, downloaded on every run before (1.5 minutes). The open
      # «basic» provider (actions/cache), not the default proprietary one; saved from main only.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: NDK and SDK platform from the SDK manager
        run: |
          # `yes` dies of SIGPIPE when sdkmanager closes stdin; that must not fail the step under pipefail.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          # The SDK repository names API 37 "android-37.0" (compileSdk = 37 resolves to it).
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-37.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      # The APK only: an AAB, Tauri's default beside it, cost a second Rust build through Gradle.
      - name: Android debug build (arm64)
        run: bun run tauri android build --debug --target aarch64 --apk
      # The plugin's Kotlin unit tests (the WebView version check), with the Gradle project the build made.
      - name: Plugin unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew :tauri-plugin-koona-mobile:testDebugUnitTest
      # The share sheet's queue files against the fixtures the Rust tests read too, its link finding.
      - name: Share plugin unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew :tauri-plugin-koona-share:testDebugUnitTest
      # Android's 16 KB pages: zipalign and the ELF LOAD alignment, as build:android checks its release APK.
      - name: 16 KB alignment of the APK
        run: bun scripts/build-android.mjs --check src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
      # The site's APK carries no Google Play Billing (NP-154): no BILLING permission, no billing classes.
      - name: No Play Billing in the site's APK
        run: bun scripts/check-apk-billing.mjs src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk absent
      # The Google Play build (feature store-play): its Rust (cfg(play)) and the koona-play plugin's
      # Kotlin compile, the plugin's unit tests pass, and its APK carries Play Billing. Built over the
      # same project: only the main crate and the plugin's module are new, and the interface is the one
      # the first build made (no beforeBuildCommand).
      - name: Android debug build, Google Play (arm64)
        run: bun run tauri android build --debug --target aarch64 --apk --features store-play --config '{"build":{"beforeBuildCommand":null}}'
      - name: Play plugin unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew :tauri-plugin-koona-play:testDebugUnitTest
      - name: Play Billing in the Google Play build's APK
        run: bun scripts/check-apk-billing.mjs src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk present

  ios:
    name: iOS Simulator / build
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # The Xcode the release builds with (27.1, Swift 6.4), so the plugin's iPhone Duo and scroll edge code
    # behind `#if compiler(>=6.4)` / `#if compiler(>=6.2)` is compiled here too. Only the xcode-27 image
    # (a public preview, actions/runner-images#14404) has it; its default Xcode is 27.0.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcode-select -p
          xcodebuild -version
      # The Tauri CLI wants the Simulator runtime of the SDK, and the image has iOS 27.0 only.
      - name: iOS 27.1 Simulator runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q 'iOS 27\.1 '; then
            xcodebuild -downloadPlatform iOS -buildVersion 27.1 -architectureVariant arm64
          fi
          xcrun simctl list runtimes
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # llvm-tools: swift-rs keeps the plugins' Swift entry points exported with its llvm-objcopy, which a
      # release build needs (scripts/build-ios-sim.mjs); here only, not in rust-toolchain.toml for every job.
      - name: Rust from rust-toolchain.toml, with the Simulator target and llvm-tools
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios-sim
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Per Xcode: the swift-rs objects of the plugins are built by its Swift.
          key: ios-sim-xcode-27.1
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
      # Signed to run in the Simulator only: no team, no profile.
      - name: iOS Simulator debug build (arm64)
        run: bun run tauri ios build --debug --target aarch64-sim

  # The one check main requires besides CLA: green when every job above either passed or was not needed
  # (skipped), red when one failed or was cancelled. It always runs, so a pull request of docs only has
  # it too, in seconds.
  # docs/kpin is a copy of koona-project/kpin at the release in docs/kpin.tag: the format changes
  # there, never only here (scripts/check-kpin-copy.mjs). Only when the copy, its pin or the check
  # change, or on a push to main; the Linux pipeline's Rust tests and Vitest run the copy's suite.
  kpin-copy:
    name: .kpin copy
    needs: changes
    if: needs.changes.outputs.kpin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-kpin-copy.mjs

  ci:
    name: CI
    if: ${{ always() }}
    needs: [changes, linux, windows, macos, android, ios, kpin-copy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "::error::A job of this run failed or was cancelled"
            exit 1
          fi
