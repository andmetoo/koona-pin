name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    if: false # TEMP while debugging native
    name: Build, unit tests, Playwright UI
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: checks
      - run: npm ci
      - name: TypeScript and Vite build
        run: npm run build
      - name: Vitest
        run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      # Screenshot baselines depend on local font rendering and are checked locally only.
      - name: Playwright UI, functional
        run: npm run test:ui -- --grep-invert "@visual"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-ui-results
          path: test-results/
          if-no-files-found: ignore

  native:
    name: WebView2, HTTP and Chrome extension smoke
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: native
      - run: npm ci
      - name: Frontend build for embedding
        run: npm run build
      - name: Native binary with embedded assets
        working-directory: src-tauri
        run: cargo build --features custom-protocol --locked
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Diagnose native startup
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\*' -ErrorAction SilentlyContinue | Select-Object name, pv | Format-Table -AutoSize
          $data = Join-Path $PWD ".test-data\diagnose"
          New-Item -ItemType Directory -Force $data | Out-Null
          $env:ODDCLICKS_DATA_DIR = $data
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $data 'webview'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9225'
          $env:RUST_BACKTRACE = '1'
          $app = Start-Process src-tauri\target\debug\oddclicks.exe -PassThru -RedirectStandardOutput "$data\out.txt" -RedirectStandardError "$data\err.txt"
          Start-Sleep 20
          "exited: $($app.HasExited) code: $($app.ExitCode)"
          Get-Process oddclicks, msedgewebview2 -ErrorAction SilentlyContinue | Select-Object Name, Id, StartTime | Format-Table -AutoSize
          Get-NetTCPConnection -State Listen -LocalPort 9225, 28765 -ErrorAction SilentlyContinue | Select-Object LocalPort, OwningProcess | Format-Table -AutoSize
          '--- policies'; Get-ChildItem 'HKLM:\SOFTWARE\Policies\Microsoft', 'HKCU:\SOFTWARE\Policies\Microsoft' -Recurse -ErrorAction SilentlyContinue | Where-Object Name -match 'Edge|WebView' | ForEach-Object { $_.Name; $_ | Get-ItemProperty | Out-String }
          '--- command lines'; Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Select-Object -First 1 -ExpandProperty CommandLine
          '--- DevToolsActivePort'; Get-Content (Join-Path $data 'webview\EBWebView\DevToolsActivePort') -ErrorAction SilentlyContinue
          '--- all listeners of webview'; $ids = (Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Id; Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $ids -contains $_.OwningProcess } | Select-Object LocalAddress, LocalPort | Format-Table -AutoSize
          '--- stdout'; Get-Content "$data\out.txt" -ErrorAction SilentlyContinue
          '--- stderr'; Get-Content "$data\err.txt" -ErrorAction SilentlyContinue
          '--- data'; Get-ChildItem $data -Recurse -Depth 2 | Select-Object -ExpandProperty FullName
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
      # The three suites share loopback port 28765, so they run one after another.
      - name: Real WebView2
        run: npm run test:native
      - name: Native HTTP smoke
        run: python scripts/smoke-native.py
      - name: Chrome for Testing, MV3 extension
        run: npm run test:extension
      - name: Extension package
        run: npm run extension:zip
      - name: Tests left the default user data untouched
        if: always()
        shell: pwsh
        run: |
          $default = @(
            (Join-Path $env:APPDATA 'OddClicks'),
            (Join-Path $env:LOCALAPPDATA 'com.oddclicks.app')
          ) | Where-Object { Test-Path $_ }
          if ($default) {
            Get-ChildItem $default -Recurse -Force | Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize | Out-String -Width 300
            Write-Error "Tests wrote outside .test-data: $($default -join ', ')"; exit 1
          }
          Write-Output "Only .test-data was used"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: native-results
          path: test-results/
          if-no-files-found: ignore
