name: Release

# A release of v<version> (scripts/release.mjs shows where one stands):
#   push of the tag v<version> (bun run release:tag)
#     verify   the tag names the version of its four places, the changelog has it, the commit is on main
#     verify   also waits for the commit's CI on main («CI» of ci.yml) and requires it green
#     linux    linux.yml with release: true — compile and pack only; the tests ran in that CI
#     macos    bun run build:macos: the .app in a ZIP and a .dmg, and with a Developer ID the .app.tar.gz of the
#              updater (Apple signing only with its secrets)
#     draft    the Linux packages signed for the updater, a draft GitHub Release with the changelog's notes
#              and these files
#   workflow_dispatch from the tag, --ref v<version> (bun run release:windows starts it after uploading the
#   signed installer)
# The update key (TAURI_SIGNING_PRIVATE_KEY and its password) is a secret of the environment «release»,
# which opens to tags v* only: draft and finalize declare it, nothing else in the repository can read it.
#     finalize the draft's files signed for the updater where they are not yet, latest.json, the AUR's
#              PKGBUILD and .SRCINFO, release.json signed (build-release-data.mjs, which also signs the
#              macOS DMG for the site, the Mac's .app.tar.gz as macos-aarch64); the release published
#     deploy   the release data to koona.app over SSH (unit «app» of koona-deploy, andmetoo/koona-site):
#              the server checks every signature against the update key's public half before it serves
#              anything, and the site's pages read release.json at request time. Skipped with a warning
#              while DEPLOY_HOST is not set. A failed deploy is rerun alone: gh run rerun <run> --failed.
#     aur      the release's PKGBUILD and .SRCINFO pushed to aur.archlinux.org/koonapin-bin.git
#              (AUR_SSH_KEY of the maintainer's AUR account); skipped with a warning without the key
# The Windows installer is not built here: Tauri signs the exes inside it with Certum while it builds,
# and Certum signs only on the owner's computer (SimplySign).
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Finalize {0}', inputs.tag) || format('Release {0}', github.ref_name) }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, v<version>
        required: true
        type: string
      only:
        description: linux = publish without a Windows installer (Windows keeps the last one)
        type: choice
        options: [all, linux]
        default: all

# One run per tag at a time; a release run is never cancelled halfway.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Tag, version, changelog, CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The CI of main may still be running when the tag comes right after the merge.
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
    steps:
      # Full history: verify checks that the tag's commit is on origin/main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun scripts/release-tag.mjs --verify "$TAG"
      # The release does not run the tests again (linux.yml with release: true only packs): the tag's
      # commit must have passed the full CI of main, the summary check «CI» of ci.yml. It waits for a CI
      # still running, and refuses a commit whose CI failed or never ran.
      - name: The commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse "$TAG^{commit}")
          for _ in $(seq 110); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=CI&filter=latest" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | max_by(.started_at) | if . == null then "" else "\(.status) \(.conclusion)" end' 2> /dev/null || true)
            case "$state" in
              "completed success") echo "CI of ${sha:0:7}: success"; exit 0 ;;
              completed*) echo "::error::CI of ${sha:0:7} is «${state#completed }»: a release is made of a commit that passed CI"; exit 1 ;;
            esac
            echo "CI of ${sha:0:7}: ${state:-not started yet}; waiting"
            sleep 30
          done
          echo "::error::No finished CI for ${sha:0:7} after 55 minutes: rerun CI on main, then this run"
          exit 1

  linux:
    name: Linux
    needs: verify
    uses: ./.github/workflows/linux.yml
    with:
      release: true
    secrets: inherit
    permissions:
      contents: read
      packages: write

  macos:
    name: macOS 15 / arm64
    needs: verify
    # The Developer ID certificate and the App Store Connect key are secrets of the environment release,
    # which opens to tags v* only: no pull request, branch or run on main can read them.
    environment: release
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      # Whether there is a Developer ID certificate, without the certificate itself in the job's
      # environment, where every step (the actions' too) would read it.
      - name: Apple certificate configured?
        id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: echo "certificate=$([ -n "$APPLE_CERTIFICATE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-macos-arm64-${{ hashFiles('bun.lock') }}
          restore-keys: bun-macos-arm64-
      - name: Rust from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-release-arm64
      - run: bun install --frozen-lockfile
      # dmgbuild, which makes the DMG (build-macos.mjs), needs Python 3.10 or later.
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.13'
      # The Developer ID certificate into a keychain of this run, when the secrets are there (later,
      # NP-051); without them build-macos.mjs makes an ad hoc signed build and says so.
      - name: Apple certificate into a temporary keychain
        if: steps.apple.outputs.certificate == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -hex 16)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          # Notarization by an App Store Connect API key: its .p8 as a file, as Tauri expects.
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
      - name: Release build, ZIP and DMG
        env:
          KOONAPIN_FEEDBACK_URL: ${{ secrets.KOONAPIN_FEEDBACK_URL }}
          KOONAPIN_SYNC_URL: ${{ secrets.KOONAPIN_SYNC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          PADDLE_ENVIRONMENT: ${{ secrets.PADDLE_ENVIRONMENT }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: bun run build:macos
      # verify made sure the tag is v<version>. A path without a wildcard: the artifact holds the files only.
      - id: version
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: koonapin-macos-arm64
          path: release/publish/macos/${{ steps.version.outputs.value }}/arm64/
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [verify, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The update key lives here only: the environment «release» opens to tags v* (Settings → Environments),
    # so no pull request, branch or run on main can read it. linux.yml never sees it.
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v7
        with:
          name: koonapin-linux-x86_64
          path: dist/linux
      - uses: actions/download-artifact@v7
        with:
          name: koonapin-macos-arm64
          path: dist/macos
      # The Tauri CLI signs (tauri signer sign), bound to the version (requireSignedVersion).
      - run: bun install --frozen-lockfile
      - name: Sign the Linux packages and the Mac's for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not in the environment «release»: bun run ci:secrets"
            exit 1
          fi
          version="${TAG#v}"
          for f in "koonapin_${version}_amd64.deb" "koonapin-${version}-1.x86_64.rpm" "koonapin-${version}-x86_64.AppImage"; do
            bunx tauri signer sign --app-version "$version" "dist/linux/$f"
            test -s "dist/linux/$f.sig"
          done
          # The Mac's .app.tar.gz (NP-051), made by a build with a Developer ID only.
          mac="dist/macos/koonapin-${version}-macos-arm64.app.tar.gz"
          if [ -f "$mac" ]; then
            bunx tauri signer sign --app-version "$version" "$mac"
            test -s "$mac.sig"
          else
            echo "::warning::No $(basename "$mac"): the Macs get no update from this release"
          fi
      # One SHA256SUMS per system on the release: the Windows one comes from release:windows.
      - name: Files for the release
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p upload
          for f in "koonapin_${version}_amd64.deb" "koonapin-${version}-1.x86_64.rpm" "koonapin-${version}-x86_64.AppImage"; do
            for g in "$f" "$f.sig"; do
              test -f "dist/linux/$g" || { echo "::error::$g is not in the Linux artifact"; exit 1; }
              cp "dist/linux/$g" upload/
            done
          done
          cp dist/linux/SHA256SUMS.txt upload/SHA256SUMS-linux.txt
          cp dist/macos/*.zip dist/macos/*.dmg upload/
          for g in dist/macos/*.app.tar.gz dist/macos/*.app.tar.gz.sig; do
            if [ -f "$g" ]; then cp "$g" upload/; fi
          done
          cp dist/macos/SHA256SUMS.txt upload/SHA256SUMS-macos.txt
          ls -l upload
          bun scripts/lib/release-notes.mjs "$version" > notes.md
      # A draft may be there already: release:windows creates it when it comes first, and a rerun finds
      # its own. A published release is never changed here.
      - name: Draft with the changelog's notes
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then echo "::error::$TAG is published already"; exit 1; fi
            gh release edit "$TAG" --title "Koona Pin $version" --notes-file notes.md
          else
            gh release create "$TAG" --draft --verify-tag --title "Koona Pin $version" --notes-file notes.md \
              || gh release edit "$TAG" --title "Koona Pin $version" --notes-file notes.md
          fi
          gh release upload "$TAG" upload/* --clobber
          echo "Draft $TAG: $(gh release view "$TAG" --json url --jq .url). Next, on Windows: bun run release:windows" >> "$GITHUB_STEP_SUMMARY"

  finalize:
    # The run's title names the tag (run-name); a tag push skips this job, and an expression of inputs
    # would show unexpanded there.
    name: Finalize
    if: github.event_name == 'workflow_dispatch'
    # The update key signs the installer: the environment «release» lets in runs from a tag v* only, so
    # finalize is started from the tag (gh workflow run release.yml --ref v<version>, release:windows does).
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ONLY: ${{ inputs.only }}
    steps:
      # The tag's own scripts and version: latest.json and the AUR files are of that commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun scripts/release-tag.mjs --verify "$TAG"
      # Started from main the environment would not have let it in; started from another tag it would run
      # that tag's workflow.
      - name: Started from its own tag
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::Start finalize from the tag: gh workflow run release.yml --ref $TAG -f tag=$TAG (this run: $GITHUB_REF)"
            exit 1
          fi
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-linux-${{ hashFiles('bun.lock') }}
          restore-keys: bun-linux-
      # The Tauri CLI signs (tauri signer sign).
      - run: bun install --frozen-lockfile
      # The draft's packages into the folders build-latest.mjs and build-aur.mjs read
      # (release/publish/<system>/<version>/, scripts/lib/paths.mjs).
      - name: The draft's files
        run: |
          set -euo pipefail
          version="${TAG#v}"
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$draft" != true ]; then echo "::error::$TAG is not a draft: published already, or no release"; exit 1; fi
          gh release download "$TAG" --dir release/download
          linux="release/publish/linux/$version"
          mkdir -p "$linux"
          for f in "koonapin_${version}_amd64.deb" "koonapin-${version}-1.x86_64.rpm" "koonapin-${version}-x86_64.AppImage"; do
            for g in "$f" "$f.sig"; do
              test -f "release/download/$g" || { echo "::error::The draft has no $g: release.yml's run of the tag is not done"; exit 1; }
              mv "release/download/$g" "$linux/"
            done
          done
          # gh writes the files in no particular order: a .sig must not look older than its package,
          # or build-latest.mjs signs again (linux.yml signed them in the run of these very packages).
          touch "$linux"/*.sig
          if [ "$ONLY" != linux ]; then
            installer="koonapin_${version}_x64-setup.exe"
            test -f "release/download/$installer" || { echo "::error::The draft has no $installer: bun run release:windows (or only: linux)"; exit 1; }
            mkdir -p "release/publish/windows/$version"
            # Its .sig of an earlier finalize stays behind: the installer may have been uploaded again since.
            mv "release/download/$installer" "release/publish/windows/$version/"
          fi
          # The macOS DMG, a download of the site: build-release-data.mjs takes it from here into release.json's
          # files.macos and signs it. A draft without it publishes without macOS.
          # Its .sig of an earlier finalize stays behind: build-release-data.mjs signs this DMG anew.
          mac="release/publish/macos/$version/arm64"
          dmg="koonapin-${version}-macos-arm64.dmg"
          if [ -f "release/download/$dmg" ]; then
            mkdir -p "$mac"
            mv "release/download/$dmg" "$mac/"
          else
            echo "::warning::The draft has no $dmg: release.json goes without macOS"
          fi
          # The Mac's update (NP-051) with the .sig the draft made: build-latest.mjs puts it into latest.json.
          update="koonapin-${version}-macos-arm64.app.tar.gz"
          if [ -f "release/download/$update" ] && [ -f "release/download/$update.sig" ]; then
            mkdir -p "$mac"
            mv "release/download/$update" "release/download/$update.sig" "$mac/"
            touch "$mac/$update.sig"
          else
            echo "::warning::The draft has no $update with its .sig: latest.json goes without macOS"
          fi
      - name: Update signatures, latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$ONLY" = linux ]; then bun run build:latest -- --only linux; else bun run build:latest; fi
      - name: PKGBUILD and .SRCINFO of the AUR
        run: bun run build:aur
      # What koona.app/pin shows of the release, signed with the update key: koona-deploy refuses it unsigned.
      # The DMG goes into the updates folder with its .sig here. SHA256SUMS.txt (build-latest.mjs) does not
      # list it: release.json carries its sha256, and the release has SHA256SUMS-macos.txt.
      - name: release.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun scripts/build-release-data.mjs --version "${TAG#v}"
      # Asset names without a leading dot or spaces, which GitHub would change.
      - name: Into the release, published
        run: |
          set -euo pipefail
          version="${TAG#v}"
          updates="release/publish/updates/$version"
          mkdir -p upload
          cp "$updates/latest.json" "$updates/SHA256SUMS.txt" "$updates/release.json" "$updates/release.json.sig" upload/
          cp "release/publish/aur/$version/PKGBUILD" upload/koonapin-bin.PKGBUILD
          cp "release/publish/aur/$version/.SRCINFO" upload/koonapin-bin.SRCINFO
          if [ "$ONLY" != linux ]; then cp "$updates/koonapin_${version}_x64-setup.exe.sig" upload/; fi
          dmg="koonapin-${version}-macos-arm64.dmg"
          if [ -f "$updates/$dmg.sig" ]; then cp "$updates/$dmg.sig" upload/; fi
          ls -l upload
          gh release upload "$TAG" upload/* --clobber
          gh release edit "$TAG" --draft=false --latest
          {
            echo "Published $TAG: $(gh release view "$TAG" --json url --jq .url)"
            echo
            echo "Next: the deploy job serves it on koona.app; the AUR files to aur.archlinux.org/koonapin-bin.git by hand."
          } >> "$GITHUB_STEP_SUMMARY"
      # The bundle of the unit «app», flat and exactly these (koona-deploy refuses a missing or an extra
      # file): release.json with its .sig, latest.json, SHA256SUMS.txt, and every file release.json lists
      # with its .sig — the packages latest.json names (build-release-data.mjs checked that) and the macOS
      # DMG when there is one. An artifact, so that the deploy job can be rerun alone once the release is
      # published (finalize itself takes drafts only).
      - name: The release data for koona.app
        run: |
          set -euo pipefail
          updates="release/publish/updates/${TAG#v}"
          files=(release.json release.json.sig latest.json SHA256SUMS.txt)
          while IFS= read -r name; do files+=("$name" "$name.sig"); done \
            < <(jq -r '.files | to_entries[] | select(.key != "sums") | .value.name' "$updates/release.json")
          mkdir -p deploy
          for f in "${files[@]}"; do
            test -f "$updates/$f" || { echo "::error::$f is not in $updates"; exit 1; }
            cp "$updates/$f" deploy/
          done
          ls -l deploy
      - uses: actions/upload-artifact@v7
        with:
          name: koonapin-release-data
          path: deploy/
          if-no-files-found: error

  deploy:
    name: Deploy to koona.app
    needs: finalize
    if: github.event_name == 'workflow_dispatch'
    # DEPLOY_SSH_KEY, DEPLOY_HOST and DEPLOY_KNOWN_HOSTS are secrets of the environment «release» (tags v*
    # only). The key opens nothing but koona-deploy on the server (command= in its authorized_keys).
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: koonapin-release-data
          path: deploy
      # `ssh deploy@<host> app <tag> < bundle.tar`: the server verifies the bundle (signatures against its
      # pinned update.pub, versions, addresses, hashes), then switches its data atomically; no reload.
      - name: The release data to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::warning::DEPLOY_HOST is not in the environment «release»: koona.app is not set up for deploys yet, $TAG is published but not served (andmetoo/koona-site server/README.md)."
            echo "Not deployed: DEPLOY_HOST is not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_HOST is set, DEPLOY_SSH_KEY or DEPLOY_KNOWN_HOSTS is not (environment «release»)"
            exit 1
          fi
          key="$RUNNER_TEMP/deploy_key"
          known="$RUNNER_TEMP/known_hosts"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known"
          cd deploy
          tar -cf - -- * | ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known" "deploy@$DEPLOY_HOST" app "$TAG"
          rm -f "$key"
          echo "Deployed $TAG to koona.app: https://koona.app/pin/updates/latest.json" >> "$GITHUB_STEP_SUMMARY"

  # The AUR package koonapin-bin (NP-101): the PKGBUILD and .SRCINFO finalize attached to the release,
  # pushed to aur.archlinux.org/koonapin-bin.git. AUR_SSH_KEY is the private key of the maintainer's AUR
  # account (an SSH key added in that account's settings), AUR_KNOWN_HOSTS the line of
  # `ssh-keyscan -t ed25519 aur.archlinux.org`; both secrets of the environment «release». Without the key
  # the job warns and the files stay on the release for a push by hand.
  aur:
    name: AUR
    needs: finalize
    if: github.event_name == 'workflow_dispatch'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: koonapin-bin to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::warning::AUR_SSH_KEY is not in the environment «release»: koonapin-bin.PKGBUILD and .SRCINFO of $TAG wait on the release for a push by hand."
            exit 0
          fi
          [ -n "$AUR_KNOWN_HOSTS" ] || { echo "::error::AUR_SSH_KEY is set, AUR_KNOWN_HOSTS is not"; exit 1; }
          key="$RUNNER_TEMP/aur_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$AUR_SSH_KEY" > "$key"
          printf '%s\n' "$AUR_KNOWN_HOSTS" > "$RUNNER_TEMP/aur_known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/aur_known_hosts"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p koonapin-bin.PKGBUILD -p koonapin-bin.SRCINFO --dir files
          # An empty repository the first time: the first push creates the package in the account.
          git clone -q ssh://aur@aur.archlinux.org/koonapin-bin.git aur
          cp files/koonapin-bin.PKGBUILD aur/PKGBUILD
          cp files/koonapin-bin.SRCINFO aur/.SRCINFO
          cd aur
          git config user.name "Koona"
          git config user.email "support@koona.app"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "koonapin-bin already has the PKGBUILD of $TAG"
          else
            git commit -q -m "koonapin-bin ${TAG#v}"
            git push -q origin HEAD:master
            echo "koonapin-bin ${TAG#v} on the AUR: https://aur.archlinux.org/packages/koonapin-bin" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$key"
