# CLA check (CONTRIBUTING.md, CLA.md): on the first pull request of a new contributor it asks them to
# sign the CLA with one comment and records the signature in signatures/version1/cla.json on the
# branch cla-signatures. A pull request without a signature keeps a failing check.
#
# pull_request_target runs with this repository's token even for pull requests from forks, so this
# workflow must never check out or run code from the pull request: it only reads comments and writes
# the signature file. Do not add a checkout step here.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/andmetoo/koona-pin/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: andmetoo,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
