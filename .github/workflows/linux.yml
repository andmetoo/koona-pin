name: Linux

# The Linux-beta test matrix (NP-093, NP-094; doc/testing.md «Linux»): the release binary is built once on
# the oldest glibc of the matrix first; then the tests and that very binary on every distribution, each in
# its own container. Manual only, like ci.yml (Actions → Linux → Run workflow); locally
# the same workflow with act:
#   act workflow_dispatch -W .github/workflows/linux.yml       (.actrc: runner image, artifact folder)
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The binary that ships: built on Debian 13 (glibc 2.41, the oldest of the matrix) — a binary built on a
  # newer glibc does not start on an older one — and packed as .deb and .rpm, checked by lintian (NP-055).
  build:
    name: Release build and packages (Debian 13)
    runs-on: ubuntu-latest
    container:
      image: debian:13
      # The apt mirror and packages of scripts/linux/ci-setup.sh are kept here between local runs; on
      # GitHub it is a new empty volume.
      options: --volume koona-ci-cache:/var/cache/koona-ci
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        if: ${{ !env.ACT }}
        with:
          path: |
            /opt/cargo/registry
            /home/dev/.npm
            src-tauri/target
          key: linux-build-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'package-lock.json') }}
          restore-keys: linux-build-
      - name: Packages, Rust, Node, user «dev»
        run: bash scripts/linux/ci-setup.sh
      # The packages are the release build (public-release): it does not compile without the feedback
      # address. On GitHub a repository secret; under act, .env (.actrc: --secret-file).
      - name: Release build and packages as «dev»
        env:
          KOONAPIN_FEEDBACK_URL: ${{ secrets.KOONAPIN_FEEDBACK_URL }}
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-build.sh"
      # v4, not v7: the artifact server of act 0.2.89 answers v7 with an empty body. GitHub serves both.
      - uses: actions/upload-artifact@v4
        with:
          name: koonapin-linux-x86_64
          path: dist-linux/
          if-no-files-found: error

  # What ci.yml does on Windows — Rust tests, IPC types, build, Vitest, extension lint, Playwright UI
  # without @visual — from the sources, once the build has passed.
  check:
    name: Tests (Debian 13)
    needs: build
    runs-on: ubuntu-latest
    container:
      image: debian:13
      options: --volume koona-ci-cache:/var/cache/koona-ci
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The cache action keeps nothing under act (no cache server): it is skipped there.
      - uses: actions/cache@v6
        if: ${{ !env.ACT }}
        with:
          path: |
            /opt/cargo/registry
            /home/dev/.npm
            src-tauri/target
          key: linux-check-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'package-lock.json') }}
          restore-keys: linux-check-
      - name: Packages, Rust, Node, user «dev»
        run: bash scripts/linux/ci-setup.sh
      # The .deb of «build», for the capture before the first start with Debian's browsers (NP-055).
      - uses: actions/download-artifact@v4
        with:
          name: koonapin-linux-x86_64
          path: dist-linux/
      - name: Install the .deb
        run: apt-get install -y -qq ./dist-linux/koonapin_*_amd64.deb > /dev/null
      # Not root: root ignores file permissions, and the tests of read-only folders would pass for the
      # wrong reason.
      - name: Tests as «dev»
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-check.sh"

  # The interface in the distribution's WebKitGTK (NP-098): key screens of 14 languages in both themes
  # without cut labels, the system theme and «reduce motion» from GTK and GNOME settings in Koona Pin itself;
  # no speed measures here, the scroll is measured by hand. WebKitGTK has no CDP: WebKitWebDriver drives
  # MiniBrowser and the app. Debian 13 and Ubuntu 26.04 bring the newest and the oldest WebKitGTK of the matrix.
  webkitgtk:
    name: WebKitGTK ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [debian:13, ubuntu:26.04]
    steps:
      - uses: actions/checkout@v7
      - name: WebKitWebDriver, fonts, screens, settings, user «dev»
        run: bash scripts/linux/ci-webkitgtk.sh setup
      - uses: actions/download-artifact@v4
        with:
          name: koonapin-linux-x86_64
          path: dist-linux/
      - run: chown -R dev dist-linux && chmod +x dist-linux/koonapin
      - name: The interface in WebKitGTK as «dev»
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-webkitgtk.sh"
      # Screenshots to compare with Windows (node scripts/webkitgtk-check.mjs --pairs).
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: webkitgtk-${{ matrix.image == 'debian:13' && 'debian-13' || 'ubuntu-26.04' }}
          path: .test-data/webkitgtk-check/
          if-no-files-found: ignore

  # The latest version of each distribution: the package of «build» installed by apt or dnf with its own
  # dependencies (Arch: the bare binary with its libraries; AUR is NP-101), started without a screen under
  # X11 and Wayland — library in ~/.local/share/Koona Pin, a second start hands over to the first — then
  # installed again and removed (NP-055).
  distro:
    name: ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:26.04, debian:13, fedora:44, archlinux:latest]
    steps:
      - uses: actions/checkout@v7
      - name: Screens, session bus, user «dev»
        run: bash scripts/linux/ci-runtime.sh
      - uses: actions/download-artifact@v4
        with:
          name: koonapin-linux-x86_64
          path: dist-linux/
      # Artifacts arrive as root and without the executable bit.
      - run: chown -R dev dist-linux && chmod +x dist-linux/koonapin dist-linux/koonapin-host
      - name: Install the package
        run: bash scripts/linux/ci-package.sh install
      - name: Start the program as «dev»
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-smoke.sh"
      # Fedora's Firefox reads only /usr/lib64/mozilla: the one place the .rpm differs (Р-53).
      - name: Fedora's Firefox and Chromium with the package as «dev»
        if: ${{ matrix.image == 'fedora:44' }}
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-browsers.sh"
      - name: Install again and remove the package
        run: bash scripts/linux/ci-package.sh remove
