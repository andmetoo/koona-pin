name: Linux

# The Linux pipeline (NP-093, NP-094, plan A4; docs/testing.md): the main tests of the project and the release
# packages. The binaries are compiled once, on Void Linux («build»), and every package job packs and checks
# those very binaries on its own distribution. Every job runs in a prebuilt image of scripts/linux/images/
# («images» builds and pushes the ones whose inputs changed): the jobs install nothing.
#   ci.yml        pull requests and main, `secrets: inherit`
#   release.yml   a version tag, `release: true`: compile and pack only — the tests, the WebKitGTK and the
#                 distribution checks are skipped, release.yml's verify requires the commit's CI on main to
#                 have passed them; release.yml signs the packages for the updater itself, in the
#                 environment «release» that holds the key (never this workflow)
#   Actions → Linux → Run workflow, by hand
# The callers set the concurrency. The caller must let «images» have `packages: write`.
on:
  workflow_call:
    inputs:
      release:
        description: Release build — the feedback address is required; compile and pack only, no tests
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release:
        description: Release build — the feedback address is required; compile and pack only, no tests
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The images' references, tagged by a hash of their Dockerfile and the scripts it runs: present → reused in
  # seconds, else built and pushed to GHCR. A pull request from a fork cannot push: it uses what is there.
  images:
    name: CI images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      void: ${{ steps.ensure.outputs.void }}
      debian: ${{ steps.ensure.outputs.debian }}
      ubuntu: ${{ steps.ensure.outputs.ubuntu }}
      fedora: ${{ steps.ensure.outputs.fedora }}
      arch: ${{ steps.ensure.outputs.arch }}
      ui: ${{ steps.ensure.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Find, or build and push, the images
        id: ensure
        env:
          # The token of a fork's pull request (and of Dependabot's) is read-only.
          PUSH: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
        run: |
          # The repository owner's GHCR namespace, lower case as GHCR wants it (a fork pushes to its own).
          export KOONAPIN_CI_REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          if [ "$PUSH" = true ]; then
            bun scripts/linux/images.mjs ensure --push --github-output
          elif ! bun scripts/linux/images.mjs ensure --check --github-output; then
            echo "::error::A CI image this pull request needs is not in GHCR, and a fork cannot push one. A maintainer's run on a branch of this repository builds it."
            exit 1
          fi

  # The binaries that ship, compiled once (bun run build:linux's compile stage, NP-055): release build,
  # stripped, glibc no newer than the matrix's floor (check-glibc.sh), Tauri's raw .deb and the AppImage.
  build:
    name: Compile (Void)
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.images.outputs.void }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # The image's, said again for rust-cache, which reads it from the step's environment.
      CARGO_HOME: /usr/local/cargo
    steps:
      - uses: actions/checkout@v7
      # Saved from main only: a pull request reads main's cache and saving took minutes per run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-release
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The checkout and the restored caches arrive as root; the build runs as «dev».
      - run: chown -R dev "$GITHUB_WORKSPACE" "$CARGO_HOME"
      # The release build (public-release) does not compile without the feedback address. A fork's pull
      # request has no secrets: a placeholder that goes nowhere; a release without it is an error.
      - name: Feedback address
        env:
          FEEDBACK: ${{ secrets.KOONAPIN_FEEDBACK_URL }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -z "$FEEDBACK" ]; then
            if [ "$RELEASE" = true ]; then
              echo "::error::KOONAPIN_FEEDBACK_URL is not set: a release needs the feedback address"
              exit 1
            fi
            echo "::warning::KOONAPIN_FEEDBACK_URL is not set: the build sends feedback to https://feedback.invalid/"
            FEEDBACK=https://feedback.invalid/
          fi
          echo "KOONAPIN_FEEDBACK_URL=$FEEDBACK" >> "$GITHUB_ENV"
      - name: Environment
        run: |
          echo "glibc: $(ldd --version | head -1)"
          echo "webkit2gtk-4.1: $(pkg-config --modversion webkit2gtk-4.1)"
          echo "rustc: $(rustc --version), bun: $(bun --version)"
      - name: bun install
        run: su dev -s /bin/bash -c "bun install --frozen-lockfile"
      # Without the Supabase pair billing::service() turns Supporter off silently (src-tauri/build.rs);
      # without KOONAPIN_SYNC_URL the build has no sync (commercial/sync).
      - name: Release build as «dev»
        env:
          KOONAPIN_SYNC_URL: ${{ secrets.KOONAPIN_SYNC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          PADDLE_ENVIRONMENT: ${{ secrets.PADDLE_ENVIRONMENT }}
        run: su dev -s /bin/bash -c "bun scripts/build-linux-packages.mjs --stage compile"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-compile
          path: dist-linux/
          if-no-files-found: error
      # The WebDriver server of the native tests on WebKitGTK (NP-095), from the image: the package jobs have
      # no compiler. A tool of the tests, kept out of the packages' artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: tauri-driver
          path: /usr/local/bin/tauri-driver
          if-no-files-found: error

  # The main tests, from the sources: Rust, the generated IPC types against the repository, the Vite build,
  # Vitest and the extension lint. Not root: root ignores file permissions, and the tests of read-only
  # folders would pass for the wrong reason.
  test:
    name: Tests (Void)
    needs: images
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.images.outputs.void }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_HOME: /usr/local/cargo
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-test
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: chown -R dev "$GITHUB_WORKSPACE" "$CARGO_HOME"
      - name: bun install
        run: su dev -s /bin/bash -c "bun install --frozen-lockfile"
      # The tests regenerate src/bindings (ts-rs, NP-007): Linux must produce what was committed. Compared
      # with a copy taken before the tests.
      - name: Rust tests
        run: su dev -s /bin/bash -c "rm -rf /tmp/bindings-before && cp -r src/bindings /tmp/bindings-before && cd src-tauri && cargo test --locked --workspace"
      - name: Generated IPC types match the repository
        run: |
          diff -r --strip-trailing-cr /tmp/bindings-before src/bindings
          echo "ok: src/bindings unchanged"
      - name: TypeScript, Vite build, Vitest
        run: su dev -s /bin/bash -c "bun run build && bun run test"
      - name: Extension packages, web-ext lint
        run: su dev -s /bin/bash -c "bun run extension:lint"
      # The development build for the «deb» job's development registration and extension smoke (NP-100,
      # NP-054), which need Debian's browsers: the image here has none. Debug info stripped for the artifact.
      - name: Development build
        run: |
          su dev -s /bin/bash -c "cd src-tauri && cargo build --locked"
          mkdir -p dist-debug
          strip --strip-debug -o dist-debug/koonapin src-tauri/target/debug/koonapin
          strip --strip-debug -o dist-debug/koonapin-host src-tauri/target/debug/koonapin-host
      - uses: actions/upload-artifact@v7
        with:
          name: linux-debug
          path: dist-debug/
          if-no-files-found: error

  # Playwright UI without Rust. Screenshot baselines (@visual) depend on font rendering and are checked on
  # local runs only (docs/testing.md). Three shards of both projects (fullyParallel splits them by test): one
  # job took 16 minutes. The image brings the packages and Chromium, so a shard starts in seconds.
  ui:
    # A plain name: GitHub adds the matrix in brackets, «Playwright UI (1)».
    name: Playwright UI
    needs: images
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard reports its own failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: ${{ needs.images.outputs.ui }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: chown -R dev "$GITHUB_WORKSPACE"
      - name: bun install
        run: su dev -s /bin/bash -c "bun install --frozen-lockfile"
      - name: Playwright UI, functional, as «dev»
        run: su dev -s /bin/bash -c 'bun run test:ui -- --grep-invert "@visual" --shard=${{ matrix.shard }}/3'
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  # Pack the .deb as soon as the release binaries are ready. Debian, Ubuntu and Arch then test the same
  # artifact in parallel; packaging does not need the development build or Debian's browser tests.
  deb-package:
    name: Pack .deb
    needs: [images, build]
    continue-on-error: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.images.outputs.debian }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: linux-compile
          path: dist-linux/
      - run: |
          chmod +x dist-linux/bin/*
          chown -R dev "$GITHUB_WORKSPACE"
      - name: Pack the .deb as «dev»
        run: su dev -s /bin/bash -c "bun scripts/build-linux-packages.mjs --stage deb"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: dist-linux/koonapin_*_amd64.deb
          if-no-files-found: error

  # On Debian 13: lintian (NP-055), the AppImage before any package (NP-116), the installed package,
  # native WebKitGTK tests (NP-095), development registration and extension smoke (NP-100, NP-054),
  # reinstall and removal. Only these tests need the development build from «test».
  deb:
    name: .deb, Debian 13
    needs: [images, build, test, deb-package]
    if: ${{ !inputs.release }}
    # These tests are advisory in CI, but the summary still waits for the whole Linux workflow.
    # Releases skip the tests and require the packaging jobs to succeed.
    continue-on-error: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ${{ needs.images.outputs.debian }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: linux-compile
          path: dist-linux/
      - uses: actions/download-artifact@v7
        with:
          name: linux-deb
          path: dist-linux/
      - uses: actions/download-artifact@v7
        with:
          name: tauri-driver
          path: dist-tools/
      - uses: actions/download-artifact@v7
        with:
          name: linux-debug
          path: src-tauri/target/debug/
      # Artifacts arrive as root and without the executable bit.
      - run: |
          chmod +x dist-linux/bin/* dist-linux/*.AppImage dist-tools/tauri-driver
          chmod +x src-tauri/target/debug/koonapin src-tauri/target/debug/koonapin-host
          chown -R dev "$GITHUB_WORKSPACE"
      - name: The tray library out of the image (the package brings it)
        run: bash scripts/linux/ci-package.sh prepare
      - name: The AppImage without a package as «dev»
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-appimage.sh"
      - name: lintian, desktop-file-validate, appstreamcli; install the package
        run: bash scripts/linux/ci-package.sh install
      - name: Start the program as «dev»
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-smoke.sh"
      - name: Native tests on WebKitGTK as «dev»
        # The tests of both displays take seconds; a hang ends here, not at the job's limit.
        timeout-minutes: 5
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-webkit.sh"
      - name: Registration with Debian's browsers, Chrome and Edge, extension smoke as «dev»
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-browsers.sh"
      - name: Install again and remove the package
        run: bash scripts/linux/ci-package.sh remove

  # The .rpm (the rpm stage, from Tauri's .deb, so it runs beside «deb-package»): rpmbuild, the DEB→RPM mark, rpmlint;
  # on Fedora the AppImage, the package with dnf, started, WebKitGTK tests, Fedora's Firefox — which reads only
  # /usr/lib64/mozilla, the one place the .rpm differs (Р-53) — and Chromium, removed.
  rpm:
    name: .rpm, Fedora 44
    needs: [images, build]
    continue-on-error: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ${{ needs.images.outputs.fedora }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: linux-compile
          path: dist-linux/
      - uses: actions/download-artifact@v7
        with:
          name: tauri-driver
          path: dist-tools/
      - run: |
          chmod +x dist-linux/bin/* dist-linux/*.AppImage dist-tools/tauri-driver
          chown -R dev "$GITHUB_WORKSPACE"
      - name: Pack the .rpm as «dev»
        run: su dev -s /bin/bash -c "bun scripts/build-linux-packages.mjs --stage rpm"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-rpm
          path: dist-linux/koonapin-*.x86_64.rpm
          if-no-files-found: error
      - name: The AppImage without a package as «dev»
        if: ${{ !inputs.release }}
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-appimage.sh"
      - name: Install the package, rpmlint
        if: ${{ !inputs.release }}
        run: bash scripts/linux/ci-package.sh install
      - name: Start the program as «dev»
        if: ${{ !inputs.release }}
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-smoke.sh"
      - name: Native tests on WebKitGTK as «dev»
        if: ${{ !inputs.release }}
        # The tests of both displays take seconds; a hang ends here, not at the job's limit.
        timeout-minutes: 5
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-webkit.sh"
      - name: Fedora's Firefox and Chromium with the package as «dev»
        if: ${{ !inputs.release }}
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-browsers.sh"
      - name: Install again and remove the package
        if: ${{ !inputs.release }}
        run: bash scripts/linux/ci-package.sh remove

  # The .deb of «deb-package» on the newest Ubuntu, alongside Debian: AppImage, apt, WebKitGTK tests, removal.
  ubuntu:
    name: Ubuntu 26.04
    needs: [images, build, deb-package]
    if: ${{ !inputs.release }}
    continue-on-error: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.images.outputs.ubuntu }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: linux-compile
          path: dist-linux/
      - uses: actions/download-artifact@v7
        with:
          name: linux-deb
          path: dist-linux/
      - uses: actions/download-artifact@v7
        with:
          name: tauri-driver
          path: dist-tools/
      - run: |
          chmod +x dist-linux/bin/* dist-linux/*.AppImage dist-tools/tauri-driver
          chown -R dev "$GITHUB_WORKSPACE"
      - name: The tray library out of the image (the package brings it)
        run: bash scripts/linux/ci-package.sh prepare
      - name: The AppImage without a package as «dev»
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-appimage.sh"
      - name: Install the package
        run: bash scripts/linux/ci-package.sh install
      - name: Start the program as «dev»
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-smoke.sh"
      - name: Native tests on WebKitGTK as «dev»
        # The tests of both displays take seconds; a hang ends here, not at the job's limit.
        timeout-minutes: 5
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-webkit.sh"
      - name: Install again and remove the package
        run: bash scripts/linux/ci-package.sh remove

  # Arch: the AppImage with no WebKitGTK 4.1 on the system (NP-116), then koonapin-bin built by makepkg from
  # the AUR's PKGBUILD for the .deb of «deb-package» (build-aur.mjs, namcap, NP-101), started, WebKitGTK tests, Arch's
  # Chromium and Firefox, removed.
  arch:
    name: Arch Linux (AUR)
    needs: [images, build, deb-package]
    # The AUR package is not published; re-enable when it is (if: ${{ !inputs.release }}).
    if: false
    continue-on-error: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.images.outputs.arch }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: linux-compile
          path: dist-linux/
      - uses: actions/download-artifact@v7
        with:
          name: linux-deb
          path: dist-linux/
      - uses: actions/download-artifact@v7
        with:
          name: tauri-driver
          path: dist-tools/
      - run: |
          chmod +x dist-linux/bin/* dist-linux/*.AppImage dist-tools/tauri-driver
          chown -R dev "$GITHUB_WORKSPACE"
      - name: The AppImage without a package as «dev»
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-appimage.sh"
      - name: Build koonapin-bin, namcap, install the package
        run: bash scripts/linux/ci-package.sh install
      - name: Start the program as «dev»
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-smoke.sh"
      - name: Native tests on WebKitGTK as «dev»
        # The tests of both displays take seconds; a hang ends here, not at the job's limit.
        timeout-minutes: 5
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-webkit.sh"
      - name: Arch's Firefox and Chromium with the package as «dev»
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-browsers.sh"
      - name: Install again and remove the package
        run: bash scripts/linux/ci-package.sh remove

  # The interface in the distribution's WebKitGTK (NP-098): key screens of 14 languages in both themes
  # without cut labels, the system theme and «reduce motion» from GTK and GNOME settings in Koona Pin itself;
  # no speed measures here, the scroll is measured by hand. WebKitGTK has no CDP: WebKitWebDriver drives
  # MiniBrowser and the app. Debian 13 and Ubuntu 26.04 bring the oldest and the newest WebKitGTK of the matrix.
  webkitgtk:
    # A plain name: GitHub adds the matrix in brackets, «WebKitGTK (debian-13)»; an expression of the
    # matrix would show unexpanded when the job is skipped (a release).
    name: WebKitGTK
    needs: [images, build]
    if: ${{ !inputs.release }}
    continue-on-error: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distro: [debian-13, ubuntu-26.04]
    container:
      image: ${{ needs.images.outputs[startsWith(matrix.distro, 'debian') && 'debian' || 'ubuntu'] }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: linux-compile
          path: dist-linux/
      - run: |
          chmod +x dist-linux/bin/koonapin
          chown -R dev "$GITHUB_WORKSPACE"
      - name: The interface in WebKitGTK as «dev»
        run: su dev -s /bin/bash -c "bash scripts/linux/ci-webkitgtk.sh"
      # Screenshots to compare with Windows (bun scripts/webkitgtk-check.mjs --pairs).
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: webkitgtk-${{ matrix.distro }}
          path: .test-data/webkitgtk-check/
          if-no-files-found: ignore

  # The three packages and SHA256SUMS.txt in one artifact (bun run build:linux's collect stage), the one
  # release.yml signs for the updater and publishes, and `bun run build:linux -- --from-ci` downloads.
  packages:
    name: Linux packages
    needs: [build, deb-package, deb, rpm]
    # Keep Debian's test completion gate in CI. A release skips «deb», so explicitly allow that case
    # while still requiring every package build to succeed (success() alone would skip the artifact).
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.deb-package.result == 'success' && (inputs.release || needs.deb.result == 'success') && needs.rpm.result == 'success' }}
    continue-on-error: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v7
        with:
          name: linux-compile
          path: dist-linux/
      - uses: actions/download-artifact@v7
        with:
          name: linux-deb
          path: dist-linux/
      - uses: actions/download-artifact@v7
        with:
          name: linux-rpm
          path: dist-linux/
      - name: Collect the packages and their checksums
        id: collect
        run: |
          bun scripts/build-linux-packages.mjs --stage collect
          version=$(bun -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "folder=release/publish/linux/$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: koonapin-linux-x86_64
          path: ${{ steps.collect.outputs.folder }}/
          if-no-files-found: error
