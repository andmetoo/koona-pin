name: macOS test build

# Experimental macOS checks for #56: what only macOS compiles — the Rust tests and the app bundle.
# IPC types and Vitest do not depend on the system and run in ci.yml. No artifacts, no Apple credentials.
on:
  pull_request:
    paths:
      - '.github/workflows/macos.yml'
      - 'src-tauri/**'
      - 'src/**'
      - 'scripts/build-macos-test.mjs'
      - 'scripts/lib/paths.mjs'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
      - 'rust-toolchain.toml'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '15.0'

jobs:
  test:
    name: macOS 15 / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          # Intel is temporarily disabled; re-enable its entry when requested.
          # - runner: macos-15-intel
          #   arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-macos-${{ matrix.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-macos-${{ matrix.arch }}-
      - name: Rust from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-test-${{ matrix.arch }}
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      # Network tests use 127.0.0.2..11 to represent different hosts. Unlike Linux/Windows,
      # macOS only binds configured loopback addresses; keep the tests themselves unchanged.
      - name: Loopback aliases for local HTTP tests
        run: |
          for suffix in {2..11}; do
            sudo ifconfig lo0 alias "127.0.0.$suffix" up
          done
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # The app bundle alone, so a packaging problem shows here; Tauri's beforeBuildCommand runs the
      # TypeScript and Vite build first. Nothing is zipped or uploaded.
      - name: TypeScript, Vite and the app bundle
        run: bun run tauri build --config src-tauri/tauri.macos-test.conf.json --bundles app
