[package]
name = "netamipin"
version = "0.1.0"
description = "Netami Pin desktop bookmark library"
edition = "2021"

[lib]
name = "netamipin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-opener = "2.0"
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `functions`: `np_fold` for search terms shorter than a trigram (NP-011).
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
# 1.3 is the last line on rusqlite 0.32; 2.x needs a newer rusqlite.
rusqlite_migration = "1.3"
uuid = { version = "1", features = ["v4", "v7"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.20"
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
dirs = "5.0"
# TypeScript types of the IPC contract, exported to src/bindings by `cargo test` (NP-007).
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
tauri-plugin-autostart = "2"
