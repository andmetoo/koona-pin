[package]
name = "netamipin"
version = "0.1.0"
description = "Netami Pin desktop bookmark library"
edition = "2021"
# src/bin/netamipin-host.rs is the native messaging host (NP-016).
default-run = "netamipin"

[lib]
name = "netamipin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
# The installer build (NP-037): the native host accepts only the store
# extensions, not the development id.
public-release = []

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-opener = "2.0"
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `functions`: `np_fold` for search terms shorter than a trigram (NP-011).
rusqlite = { version = "0.32", features = ["bundled", "functions", "backup"] }
# 1.3 is the last line on rusqlite 0.32; 2.x needs a newer rusqlite.
rusqlite_migration = "1.3"
uuid = { version = "1", features = ["v4", "v7"] }
# `system-proxy`: feedback (NP-088) goes through the Windows proxy settings; metadata and the
# link check refuse any proxy (`no_proxy`) so their address check cannot be bypassed.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "system-proxy"] }
scraper = "0.20"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
dirs = "5.0"
# TypeScript types of the IPC contract, exported to src/bindings by `cargo test` (NP-007).
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
# Already in the tree through Tauri: a test recomputes the development
# extension id from extension/dev-key.txt.
base64 = "0.22"
sha2 = "0.10"

# Native messaging (NP-016): the user's SID for the pipe name and its access
# rule, registry keys for the browsers, starting the app from the host.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }
