[package]
name = "koonapin"
version = "2.12.1"
description = "Koona Pin desktop bookmark library"
license = "GPL-3.0-only"
edition = "2021"
# src/bin/koonapin-host.rs is the native messaging host (NP-016), src/bin/koonapin-mcp.rs the MCP server (NP-091).
default-run = "koonapin"

[lib]
name = "koonapin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The sync engine (Р-68) is its own crate under the commercial license, without Tauri, so the
# phone apps can wrap it later. One SQLite links: both crates use rusqlite 0.32.
[workspace]
members = [".", "commercial/koona-sync", "commercial/koona-play", "plugins/koona-mobile", "plugins/koona-share"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
# The installer build (NP-037): the native host accepts only the store
# extensions, not the development id.
public-release = []
# The Google Play build (NP-154): Supporter through Play Billing, on Android only (`cfg(play)`, build.rs).
# Off for every other build, so the site's APK has no billing library and no BILLING permission.
store-play = ["dep:tauri-plugin-koona-play"]

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `functions`: `np_fold` for search terms shorter than a trigram (NP-011).
rusqlite = { version = "0.32", features = ["bundled", "functions", "backup"] }
# 1.3 is the last line on rusqlite 0.32; 2.x needs a newer rusqlite.
rusqlite_migration = "1.3"
uuid = { version = "1", features = ["v4", "v7"] }
# `system-proxy`: feedback (NP-088) goes through the Windows proxy settings; metadata and the
# link check refuse any proxy (`no_proxy`) so their address check cannot be bypassed.
# `gzip` (NP-128): only the feed client turns it on; every other client says `.gzip(false)`.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "system-proxy", "gzip"] }
scraper = "0.20"
# A fetched page in its own encoding: windows-1251, Shift_JIS (NP-120). The WHATWG encodings.
encoding_rs = "0.8"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
dirs = "5.0"
# TypeScript types of the IPC contract, exported to src/bindings by `cargo test` (NP-007).
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
tauri-plugin-dialog = "2"
# «Title A–Z» and «Site A–Z» (NP-114): sort keys in the interface's language.
# The other ICU4X crates are already in the tree through `url`.
icu_collator = "2.3"
icu_locale_core = "2.3"
# The MCP server `koonapin-mcp` (NP-091): the official SDK over stdio, server side only.
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io"] }
# The one-click package for Claude Desktop (`.mcpb`, a zip). Both already in the tree.
crc32fast = "1.5"
flate2 = "1.1"
# The plan signed by the server (Supporter, billing.rs): Ed25519 from `ring`, already in the tree
# through rustls; base64 through Tauri.
ring = "0.17"
base64 = "0.22"
# Sync (Р-68, NP-059): the engine and its relay client, under the commercial license
# (`commercial/koona-sync`). Schema 10 and its triggers are called from the GPL code like the
# other commercial modules; the app's glue is `src/commercial/sync`.
koona-sync = { path = "commercial/koona-sync", features = ["net"] }
# Feeds (NP-128, Р-71): RSS 0.9/1.0/2.0, Atom and JSON Feed into one model. Pinned: a 3.0.x patch
# is taken by hand after the fixture tests pass. No `sanitize`: DOMPurify in the interface is the
# one sanitizer. Its dependencies are in the tree already but `mediatype` (MIT).
feed-rs = "=3.0.0"
# OPML import and export, and the item-level `media:thumbnail` pass feed-rs 3.0.0 drops. Already
# in the tree through `plist`.
quick-xml = "0.42"
# The picture cache (NP-146): previews and icons decoded and made small, pure Rust only (zune-jpeg,
# png, gif, image-webp); no AVIF, no rayon. Keys are SHA-256 of the address; `sha2` is in the tree
# through Tauri, `percent-encoding` through `url`.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "ico", "bmp"] }
sha2 = "0.10"
percent-encoding = "2.3"

# Desktop only (NP-151): a phone has no second instance, no start at sign-in, no self-update (the
# stores update it) and no `koonapin://` links or `.kpin` files yet.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# The app updates itself (NP-038, NP-102, Р-60): checks latest.json, downloads and verifies the
# minisign signature, runs the NSIS installer on Windows. No zip: releases carry the installer
# itself. The system proxy, as feedback has (NP-088).
tauri-plugin-updater = { version = "2.13", default-features = false, features = ["rustls-tls", "system-proxy"] }
# `koonapin://import?url=…` (NP-142): the scheme registered from `plugins.deep-link` by the bundler on
# macOS and Windows. The links are read by open_requests.rs, not through the plugin's commands.
tauri-plugin-deep-link = "2.6"

# Phones only (NP-151): our own plugin for system Back, the iOS edge swipe, renderer loss, the
# insets, and (NP-072b) the signals of the phone's look and the haptics (plugins/koona-mobile).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-koona-mobile = { path = "plugins/koona-mobile" }
# Links shared from other apps (NP-071): the share sheet and its queue folder (plugins/koona-share).
tauri-plugin-koona-share = { path = "plugins/koona-share" }
# `_exit` at the end of a phone's run (lib.rs, `end_on_phone`). Already in the tree.
libc = "0.2"

# The Play build only (feature `store-play`, NP-154): Play Billing, under the commercial license.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-koona-play = { path = "commercial/koona-play", optional = true }

[dev-dependencies]
# `trace`: the example `query_plans` prints the plan of every statement a command runs (NP-114).
rusqlite = { version = "0.32", features = ["trace"] }
# The answers of the Play plugin, so billing.rs's handling of them is tested on a desktop (NP-154).
tauri-plugin-koona-play = { path = "commercial/koona-play" }

# Native messaging (NP-016): the user's SID for the pipe name and its access
# rule, registry keys for the browsers, starting the app from the host.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

# The capture socket on Linux (NP-099): the user's UID for the folder and the
# peer check, a new session for the app the host starts. Already in the tree.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The window on Linux (NP-053): the system's button layout and the activation
# token of a second start (GTK), whether a tray is there (the session bus).
# Both already in the tree through Tauri and the single-instance plugin.
gtk = "0.18"
zbus = "5.9"

# The capture socket on macOS (NP-050): the user's private folder, the UID for
# the peer check. Already in the tree.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# The Safari socket (NP-119) admits only the appex embedded in this bundle, by
# its code signature. Already in the tree through the updater's TLS verifier.
security-framework = { version = "3.7", default-features = false }
core-foundation = "0.10"
