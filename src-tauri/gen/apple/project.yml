name: koonapin
options:
  bundleIdPrefix: app.koona.pin
  deploymentTarget:
    iOS: 18.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Koona Pin
      PRODUCT_BUNDLE_IDENTIFIER: app.koona.pin
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  koonapin_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: koonapin_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: koonapin_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Export compliance (NP-078): no ITSAppUsesNonExemptEncryption. Sync's ChaCha20-Poly1305 (ring) and
        # rustls' TLS are standard algorithms outside the system's; YES without an approved
        # ITSEncryptionExportComplianceCode fails App Store validation (90592), and the only document Apple
        # asks for them is the French declaration. App Store Connect asks per build (docs/building.md).
        CFBundleShortVersionString: 2.19.0
        CFBundleVersion: "2.5.0"
    entitlements:
      path: koonapin_iOS/koonapin_iOS.entitlements
      properties:
        # The share extension's queue (koona-share): the only thing the two share. The library stays
        # in the app's own container (a locked SQLite file in a shared one gets the app killed).
        com.apple.security.application-groups: [group.app.koona.pin]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
      # StoreKit Testing for the Supporter products, in a Run from Xcode (Debug) only: never part of
      # an archive or the App Store build (commercial/koona-appstore).
      storeKitConfiguration: Supporter.storekit
    settings:
      base:
        # iPhone only: an iPad opens it in compatibility mode, at a phone's size.
        TARGETED_DEVICE_FAMILY: 1
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      # "Share → Koona Pin" (koona-share), embedded in PlugIns/.
      - target: koonapin_Share
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      # `bun run tauri` of the repository's package.json, as every other build (NP-151). A Run from
      # Xcode's own window gets Xcode's PATH, not the person's: then their own shell says where bun
      # and cargo are, wherever they were installed.
      - script: |
          if ! command -v bun >/dev/null 2>&1; then
            PATH="$("${SHELL:-/bin/zsh}" -ilc 'printf %s "$PATH"' 2>/dev/null):$PATH"; export PATH
          fi
          cd "${SRCROOT:?}/../../.." && bun run tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # "Share → Koona Pin" (koona-share): a share extension in Swift with no WebView, no Rust and no
  # network. It writes each shared link to the queue in the App Group's container, which the app takes
  # in (share_queue.rs). Its code is in src-tauri/plugins/koona-share/ios-extension.
  koonapin_Share:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../plugins/koona-share/ios-extension/Queue
      - path: ../../plugins/koona-share/ios-extension/Sheet
      - path: ../../plugins/koona-share/ios-extension/Strings
      - path: koonapin_Share/PrivacyInfo.xcprivacy
    info:
      path: koonapin_Share/Info.plist
      properties:
        CFBundleDisplayName: Koona Pin
        # Both are the app's, copied into the built extension by the phase below (App Store
        # Connect wants them equal; Tauri writes the app's build number at each build).
        CFBundleShortVersionString: "0"
        CFBundleVersion: "0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            # One web page or link, or text (with a link in it, the sheet says when there is none).
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
            # Safari's page title, read in the page by Preprocess.js.
            NSExtensionJavaScriptPreprocessingFile: Preprocess
    entitlements:
      path: koonapin_Share/koonapin_Share.entitlements
      properties:
        com.apple.security.application-groups: [group.app.koona.pin]
    settings:
      base:
        PRODUCT_NAME: KoonaPinShare
        PRODUCT_BUNDLE_IDENTIFIER: app.koona.pin.share
        TARGETED_DEVICE_FAMILY: 1
        ARCHS: [arm64]
        SWIFT_VERSION: "5.0"
        APPLICATION_EXTENSION_API_ONLY: true
        ENABLE_BITCODE: false
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
    postBuildScripts:
      - script: |
          app="${SRCROOT:?}/koonapin_iOS/Info.plist"
          built="${TARGET_BUILD_DIR:?}/${INFOPLIST_PATH:?}"
          for key in CFBundleShortVersionString CFBundleVersion; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$app")
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$built"
          done
        name: The app's version
        inputFiles:
          - $(SRCROOT)/koonapin_iOS/Info.plist
        basedOnDependencyAnalysis: false
