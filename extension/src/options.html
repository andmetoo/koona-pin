<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Texts come from _locales: options.js fills every data-i18n* element. -->
    <title data-i18n="optionsTitle">Netami Pin</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <span class="brand">
          <svg width="18" height="24" viewBox="0 0 18 24" fill="none" aria-hidden="true">
            <path
              d="M0 121V30C0 21.7 2.93 14.6 8.79 8.79 14.6 2.93 21.7 0 30 0s15.4 2.93 21.2 8.79C57.1 14.6 60 21.7 60 30v11c10 8.67 10 17.5 0 26.5-10 8.67-10 17.5 0 26.5 10 9 10 18 0 27"
              transform="translate(2.87 1) scale(0.1819)"
              stroke="currentColor"
              stroke-width="2.73"
              vector-effect="non-scaling-stroke"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          netami pin
        </span>
        <span class="version" id="version"></span>
      </header>
      <h1 data-i18n="optionsHeading"></h1>
      <p class="lead" data-i18n="optionsLead"></p>
      <section>
        <h2 data-i18n="connectionHeading"></h2>
        <div class="card" id="status" role="status" data-state="checking">
          <div class="row">
            <span class="dot"></span>
            <div class="text"><p class="title" data-i18n="connectionChecking"></p></div>
          </div>
        </div>
      </section>
      <section>
        <h2 data-i18n="feedbackHeading"></h2>
        <div class="card">
          <label class="row">
            <div class="text">
              <p class="title" data-i18n="settingMessage"></p>
              <p class="meta" data-i18n="settingMessageText"></p>
            </div>
            <input type="checkbox" role="switch" class="switch" id="feedback-message" checked />
          </label>
          <label class="row">
            <div class="text">
              <p class="title" data-i18n="settingAnimate"></p>
              <p class="meta" data-i18n="settingAnimateText"></p>
            </div>
            <input type="checkbox" role="switch" class="switch" id="feedback-animate" checked />
          </label>
        </div>
      </section>
      <section>
        <h2 data-i18n="shortcutHeading"></h2>
        <div class="card">
          <div class="row">
            <div class="text">
              <p class="title" data-i18n="menuSearch"></p>
              <p class="meta" data-i18n="shortcutText"></p>
            </div>
            <span id="shortcut" class="keys"></span>
            <button id="shortcut-change" type="button"></button>
          </div>
        </div>
        <p id="shortcut-note" class="note"></p>
      </section>
      <section>
        <div class="section-head">
          <h2><span data-i18n="queueHeading"></span> · <span id="count">0</span></h2>
          <button id="retry" class="link" data-i18n="sendNow"></button>
        </div>
        <div class="card" id="queue"></div>
        <p id="message" role="status"></p>
      </section>
      <footer data-i18n="optionsFooter"></footer>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
